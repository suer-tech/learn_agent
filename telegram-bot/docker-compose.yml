version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: practice-telegram-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BOT_API_SECRET=${BOT_API_SECRET}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PORT=3001
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
